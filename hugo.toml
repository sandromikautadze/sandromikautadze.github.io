baseURL = "https://sandromikautadze.github.io/"
locale = "en"
title = "Sandro Mikautadze"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Sandro Mikautadze is an AI researcher interested in multimodality and mechanistic interpretability."
  email = "sandromikautadze@yahoo.com"
  github = "https://github.com/sandromikautadze"
  linkedin = "https://www.linkedin.com/in/sandro-mikautadze/"
  medium = "https://medium.com/@sandromikautadze"
  x = "https://x.com/theaitemp"

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
[markup.highlight]
  noClasses = false
  lineNos = false
