<!doctype html>
<html lang="en">
<head>{{ partial "head.html" . }}</head>
<body>
<a href="#main" class="skip">Skip to content</a>
{{ partial "header.html" . }}
<main id="main" class="{{ block "mainclass" . }}{{ end }}">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ partial "plotly-loader.html" . }}
<script>
// ponytail: theme toggle; explicit choice persists, otherwise the OS preference applies
document.querySelector('.theme').addEventListener('click',()=>{const h=document.documentElement;const cur=h.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');const next=cur==='light'?'dark':'light';h.dataset.theme=next;try{localStorage.setItem('theme',next)}catch(e){}});
</script>
</body>
</html>
