<header class="site-header">
  <a class="brand" href="/" aria-label="Sandro Mikautadze, home"><img class="logo" src="/images/logo.png" alt="SM" width="34" height="28"></a>
  <nav>
    {{ $cur := . }}
    <a href="/" {{ if .IsHome }}aria-current="page"{{ end }}>About</a>
    <a href="/research/" {{ if eq .RelPermalink "/research/" }}aria-current="page"{{ end }}>Things</a>
    <a href="/blog/" {{ if eq .Section "blog" }}aria-current="page"{{ end }}>Blog</a>
    <a href="/cv/" {{ if eq .RelPermalink "/cv/" }}aria-current="page"{{ end }}>CV</a>
    <button class="theme" type="button" aria-label="Toggle light and dark theme" title="Light / dark"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
  </nav>
</header>
