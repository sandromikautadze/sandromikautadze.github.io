{{ define "main" }}
<section class="identity">
  <div class="bio">
    <h1 class="display">Sandro Mikautadze</h1>
    {{ .Content }}
  </div>
  <div class="side">
    <div class="pics">
      <div class="track">
        {{ range hugo.Data.photos }}
        {{ $img := (resources.Get .src).Resize "x1000 webp Lanczos q85" }}
        <img src="{{ $img.RelPermalink }}" alt="{{ .alt }}" width="{{ $img.Width }}" height="{{ $img.Height }}" data-caption="{{ .caption }}"{{ with .pos }} style="object-position: {{ . }}"{{ end }}>
        {{ end }}
      </div>
      <button class="next" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <p class="mono cap" aria-live="polite">{{ (index hugo.Data.photos 0).caption }}</p>
    <p class="flags"><img src="/icons/italy.svg" alt="Italy" width="16" height="16"><img src="/icons/georgia.svg" alt="Georgia" width="16" height="16"></p>
    <p class="social">{{ partial "social.html" . }}</p>
  </div>
</section>

<script>
(() => {
  const track = document.querySelector(".track"), cap = document.querySelector(".cap");
  const imgs = [...track.children], n = imgs.length;
  track.appendChild(imgs[0].cloneNode(true));
  const w = () => track.clientWidth, index = () => Math.round(track.scrollLeft / w());
  document.querySelector(".next").addEventListener("click", () => {
    if (index() >= n) return;
    track.scrollBy({ left: w(), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
  });
  // ponytail: iOS stops firing scroll before the snap settles, so the wrap runs on scrollend with a debounce fallback
  const wrap = () => { if (track.scrollLeft >= n * w() - 2) track.scrollTo({ left: 0, behavior: "instant" }); };
  let settle;
  track.addEventListener("scroll", () => {
    // only write when the caption actually changes, or the live region re-announces on every scroll tick
    const caption = imgs[index() % n].dataset.caption;
    if (cap.textContent !== caption) cap.textContent = caption;
    clearTimeout(settle); settle = setTimeout(wrap, 150);
  }, { passive: true });
  track.addEventListener("scrollend", wrap);
})();
</script>
{{ end }}
