  <!-- Post loading logic -->
  <script>
    // Markdown treats underscores as emphasis, which mangles LaTeX subscripts
    // like z_i before MathJax ever sees them. Swap $...$ and $$...$$ spans for
    // plain placeholders before parsing, then restore the raw math afterwards.
    function protectMath(text) {
      const store = [];
      const stash = (match) => {
        store.push(match);
        return `@@MATH${store.length - 1}@@`;
      };
      return {
        text: text.replace(/\$\$[\s\S]+?\$\$/g, stash).replace(/\$[^$\n]+?\$/g, stash),
        store
      };
    }

    function restoreMath(html, store) {
      return html.replace(/@@MATH(\d+)@@/g, (_, i) => store[Number(i)]);
    }

    // The static <head> can't know a post's title/description ahead of time
    // since content is fetched client-side; derive both from the rendered
    // markdown (first h1 / first paragraph) and patch title, meta tags,
    // canonical, and a BlogPosting JSON-LD block in place.
    function updateMetaTags(slug, postTitle) {
      const pageUrl = `https://sandromikautadze.github.io/post.html?slug=${slug}`;
      const firstParagraph = document.querySelector('#post-content p');
      let description = firstParagraph ? firstParagraph.textContent.trim() : 'Technical blog post by Sandro Mikautadze.';
      if (description.length > 155) {
        description = description.slice(0, 155).replace(/\s+\S*$/, '') + '…';
      }

      document.title = `${postTitle} - Sandro Mikautadze`;
      document.querySelector('meta[name="description"]').setAttribute('content', description);
      document.querySelector('[data-canonical]').setAttribute('href', pageUrl);
      document.querySelector('[data-og-title]').setAttribute('content', postTitle);
      document.querySelector('[data-og-description]').setAttribute('content', description);
      document.querySelector('[data-og-url]').setAttribute('content', pageUrl);
      document.querySelector('[data-twitter-title]').setAttribute('content', postTitle);
      document.querySelector('[data-twitter-description]').setAttribute('content', description);

      const jsonLd = document.createElement('script');
      jsonLd.type = 'application/ld+json';
      jsonLd.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'BlogPosting',
        headline: postTitle,
        url: pageUrl,
        description: description,
        author: { '@type': 'Person', name: 'Sandro Mikautadze', url: 'https://sandromikautadze.github.io/' }
      });
      document.head.appendChild(jsonLd);
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Get the 'slug' parameter from the URL (support both query param and hash)
      const urlParams = new URLSearchParams(window.location.search);
      let slug = urlParams.get('slug');

      // Fallback to hash if query param is missing
      if (!slug && window.location.hash) {
        slug = window.location.hash.substring(1);
      }

      if (!slug) {
        document.getElementById('post-title').innerText = 'Post not found';
        document.getElementById('post-content').innerHTML = `
          <p>No post specified.</p>
          <p style="font-size: 0.8em; color: #666;">Debug info: URL is ${window.location.href}</p>
        `;
        return;
      }

      // Check for file protocol and warn about CORS
      if (window.location.protocol === 'file:') {
         const warning = document.createElement('div');
         warning.style.background = 'rgba(255, 204, 0, 0.1)';
         warning.style.border = '1px solid #ffcc00';
         warning.style.color = '#ffcc00';
         warning.style.padding = '15px';
         warning.style.borderRadius = '10px';
         warning.style.marginBottom = '20px';
         warning.innerHTML = '<strong>Note:</strong> You are viewing this file locally. If the content below does not load, it is likely because browsers block loading external files (like the blog post markdown) when using the <code>file://</code> protocol. Please use a local web server (like the "Live Server" extension in VS Code) or view this page on GitHub Pages.';
         document.querySelector('.blog-posts').insertBefore(warning, document.getElementById('post-content'));
      }

      // Fetch the markdown file
      fetch(`./assets/posts/${slug}.md`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Post not found');
          }
          return response.text();
        })
        .then(text => {
          // Parse markdown, keeping LaTeX math spans intact
          const { text: guardedText, store } = protectMath(text);
          const htmlContent = restoreMath(marked.parse(guardedText), store);
          document.getElementById('post-content').innerHTML = htmlContent;

          // Extract title from the first h1 if present, otherwise use slug
          const firstH1 = document.querySelector('#post-content h1');
          const postTitle = firstH1 ? firstH1.innerText : slug.replace(/-/g, ' ');
          document.getElementById('post-title').innerText = postTitle;
          if (firstH1) {
            firstH1.remove(); // Remove the h1 from content as it's now the page title
          }

          updateMetaTags(slug, postTitle);

          // Trigger MathJax to render math in the new content. MathJax loads
          // asynchronously, so wait for its own startup promise rather than
          // calling typesetPromise before it exists.
          if (window.MathJax && MathJax.startup) {
            MathJax.startup.promise.then(() => {
              MathJax.typesetPromise([document.getElementById('post-content')]);
            });
          }
        })
        .catch(error => {
          console.error('Error loading post:', error);
          document.getElementById('post-title').innerText = 'Error';
          document.getElementById('post-content').innerHTML = '<p>Could not load the blog post. Please check if the file exists.</p>';
        });
    });
  </script>
